<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7CCSACTP — Course Video Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    header {
      background-color: #161e2e;
      border-bottom: 1px solid #2d3748;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f7fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    header nav {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    header nav a {
      color: #63b3ed;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    header nav a:hover {
      color: #90cdf4;
      text-decoration: underline;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      outline: none;
    }
    .error-container {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
    }
    .error-container h2 {
      color: #feb2b2;
      margin-bottom: 12px;
    }
    .error-container p {
      color: #a0aec0;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="video-title">Course Video Player — 7CCSACTP</h1>
    <nav>
      <a id="download-link" href="#" target="_blank" download style="display: none;">Download Video</a>
      <a href="index.html">← Back to Course Page</a>
    </nav>
  </header>
  <main>
    <video id="player" controls autoplay playsinline style="display: none;">
      Your browser does not support the video tag.
    </video>
    <div id="error-msg" class="error-container" style="display: none;">
      <h2>No Video Specified</h2>
      <p>Please specify a video parameter in the URL (e.g. <code>watch.html?v=list_recursion.mp4</code>).</p>
      <a href="index.html" style="color: #63b3ed; text-decoration: underline;">Return to Course Homepage</a>
    </div>
  </main>

  <script>
    (function() {
      const BASE_URL = "https://github.com/mabdula/7CCSACTP/releases/download/v1.0-course-videos/";
      const urlParams = new URLSearchParams(window.location.search);
      const videoFile = urlParams.get('v');

      const player = document.getElementById('player');
      const errorMsg = document.getElementById('error-msg');
      const videoTitle = document.getElementById('video-title');
      const downloadLink = document.getElementById('download-link');

      if (videoFile) {
        let cleanName = decodeURIComponent(videoFile).trim();
        if (cleanName.includes('/')) {
          cleanName = cleanName.split('/').pop();
        }
        
        const videoSrc = BASE_URL + cleanName;
        player.src = videoSrc;
        player.style.display = 'block';

        const formattedTitle = cleanName
          .replace(/\.mp4$/i, '')
          .replace(/_/g, ' ');
        
        videoTitle.textContent = "7CCSACTP: " + formattedTitle;
        document.title = formattedTitle + " — 7CCSACTP Video";

        downloadLink.href = videoSrc;
        downloadLink.style.display = 'inline';
      } else {
        errorMsg.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
